[package]
name = "auth-service"
description = "Let's Get Rusty Authorization Service"
authors = ["Fabio Correa"]
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.89"
axum = "0.8.8"
axum-extra = { version = "0.12.5", features = ["cookie"] }
chrono = "0.4.44"
clap = { version = "4.5.60", features = ["derive", "env"] }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
email_address = "0.2.9"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
rand = "0.10.0"
redis = { version = "1.0.4", features = ["tokio-comp"]}
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "macros", "migrate", "postgres"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7.18"
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.21.0", features = ["v4", "v7", "serde"] }
zxcvbn = "3.1.0"

[dev-dependencies]
fake = { version = "4.4.0", features = ["derive"] }
mime = "0.3.17"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "cookies"] }
test-context = "0.5.5"

[package]
name = "auth-service"
description = "Let's Get Rusty Authorization Service"
authors = ["Fabio Correa"]
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
axum-extra = { version = "0.12.5", features = ["cookie"] }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.21.0", features = ["v4", "v7", "serde"] }
email_address = "0.2.9"
thiserror = "2.0.18"
secrecy = "0.10.3"
async-trait = "0.1.89"
anyhow = "1.0.102"
dotenvy = "0.15.7"
clap = { version = "4.5.60", features = ["derive", "env"] }
zxcvbn = "3.1.0"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
chrono = "0.4.44"
rand = "0.10.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "macros", "migrate", "postgres"] }
tokio-util = "0.7.18"

[dev-dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["json", "cookies"] }
mime = "0.3.17"
fake = { version = "4.4.0", features = ["derive"] }
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"

[package]
name = "auth-service"
description = "Let's Get Rusty Authorization Service"
authors = ["Fabio Correa"]
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = { version = "0.1.89" }
axum = { version = "0.8.8" }
axum-extra = { version = "0.12.5", features = ["cookie"] }
chrono = { version = "0.4.44" }
clap = { version = "4.6.0", features = ["derive", "env"] }
color-eyre = { version = "0.6.5" }
dotenvy = { version = "0.15.7" }
email_address = { version = "0.2.9" }
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
percent-encoding = { version = "2.3.2" }
rand = { version = "0.10.0" }
redis = { version = "1.0.4", features = ["tokio-comp"] }
reqwest = { version = "0.13.2", default-features = false, features = ["cookies", "json", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
subtle = { version = "2.6.1" }
serde_json = { version = "1.0.149" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "macros", "migrate", "postgres"] }
thiserror = { version = "2.0.18" }
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18" }
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
tracing = { version = "0.1.44" }
tracing-error = { version = "0.2.1" }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.21.0", features = ["v4", "v7", "serde"] }
zxcvbn = { version = "3.1.0" }

[dev-dependencies]
fake = { version = "4.4.0", features = ["derive"] }
mime = { version = "0.3.17" }
quickcheck = { version = "1.1.0" }
quickcheck_macros = { version = "1.2.0" }
test-context = { version = "0.5.5" }
wiremock = { version = "0.6.5" }
